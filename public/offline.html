<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Offline · Plumbline</title>
<style>
  :root{color-scheme:dark}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0a0a09;color:#efece3;font-family:system-ui,-apple-system,sans-serif;padding:24px}
  main{max-width:520px}
  .label{font:11px/1 ui-monospace,monospace;letter-spacing:.08em;text-transform:uppercase;color:#84817a}
  h1{font:800 clamp(56px,14vw,120px)/.86 "Arial Narrow",Impact,sans-serif;text-transform:uppercase;margin:18px 0}
  h1 span{color:#d2ff1e}
  p{color:#bcb9ae;line-height:1.6}
  a,button{display:inline-block;margin-top:18px;background:#d2ff1e;color:#0a0a09;padding:14px 22px;font:12px ui-monospace,monospace;letter-spacing:.05em;text-transform:uppercase;text-decoration:none;border:0;cursor:pointer}
</style>
</head>
<body>
<main>
  <div class="label">No signal</div>
  <h1>You’re <span>offline.</span></h1>
  <p>This page wasn’t saved on your device yet. Entries you already dictated are safe in the outbox and will seal automatically when you’re back online.</p>
  <p>Tip: open <b>Dictate today’s log</b> once while you have signal — Plumbline then keeps it ready for the job site.</p>
  <button onclick="location.reload()">Try again</button>
</main>
</body>
</html>
